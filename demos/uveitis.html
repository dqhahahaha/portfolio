<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>葡萄膜炎 (Uveitis) 竞品 BI Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#f0f2f5; --panel:#ffffff; --panel2:#e8ecf1; --line:#d9dee6;
    --txt:#1a2332; --muted:#6b7a8f; --accent:#2563eb;
    --t1:#e74c3c; --t2:#e67e22; --t3:#d4a017; --t4:#27ae60;
    --hdr-bg:#1e3a5f; --hdr-txt:#ffffff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;
    background:var(--bg);color:var(--txt);line-height:1.5;font-size:14px}

  /* Header */
  header{background:var(--hdr-bg);padding:14px 24px;display:flex;align-items:center;
    justify-content:space-between;flex-wrap:wrap;gap:8px}
  header .left{display:flex;align-items:center;gap:12px}
  header .logo{background:#3b82f6;width:34px;height:34px;border-radius:8px;
    display:flex;align-items:center;justify-content:center;font-size:17px;color:#fff}
  header h1{font-size:17px;font-weight:600;color:var(--hdr-txt)}
  header .sub{color:#a0b8d0;font-size:12px}
  header .meta{color:#8098b8;font-size:11px;white-space:nowrap}

  /* Layout */
  .wrap{max-width:1600px;margin:0 auto;padding:14px 18px}

  /* KPI */
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));
    gap:10px;margin-bottom:14px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:8px;
    padding:12px 14px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
  .card .n{font-size:26px;font-weight:700;color:var(--accent)}
  .card .l{color:var(--muted);font-size:11px;margin-top:3px}
  .card .sub{color:var(--muted);font-size:10px;margin-top:1px}

  /* Filters */
  .filters{background:var(--panel);border:1px solid var(--line);border-radius:8px;
    padding:10px 14px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
  .filters .row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
  .filters .grp{display:flex;flex-direction:column;gap:2px;flex:1 1 110px;min-width:90px}
  .filters label{font-size:9px;color:var(--muted);text-transform:uppercase;
    letter-spacing:.03em;font-weight:600}
  .filters select{background:var(--panel);color:var(--txt);border:1px solid var(--line);
    border-radius:5px;padding:5px 6px;font-size:11px;width:100%;min-width:80px;
    max-height:100px}
  .filters select[multiple]{min-height:60px}
  .search-box{border:1px solid var(--line);border-radius:5px;padding:5px 8px;
    font-size:12px;width:100%;background:var(--panel);color:var(--txt)}
  .btn{border:none;border-radius:5px;padding:6px 14px;font-size:11px;cursor:pointer;
    font-weight:600;white-space:nowrap}
  .btn-primary{background:var(--accent);color:#fff}
  .btn-outline{background:var(--panel);border:1px solid var(--line);color:var(--txt)}
  .btn-primary:hover{opacity:.9}
  .btn-outline:hover{background:var(--panel2)}

  /* Panels */
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;
    padding:14px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
  .panel h2{font-size:13px;font-weight:600;margin-bottom:10px;display:flex;
    align-items:center;gap:6px}
  .panel h2 .tag{font-size:10px;color:var(--muted);font-weight:400}

  /* Charts */
  .chartbox{position:relative;height:260px}
  .chartbox.tall{height:300px}

  /* Grid */
  .grid-layout{display:grid;grid-template-columns:1fr 320px;gap:14px}
  @media(max-width:1100px){.grid-layout{grid-template-columns:1fr}}

  /* Chart 2-col row */
  .chart-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
  @media(max-width:800px){.chart-row{grid-template-columns:1fr}}

  /* Table */
  .table-scroll{max-height:550px;overflow-y:auto;
    border:1px solid var(--line);border-radius:6px}
  table{width:100%;border-collapse:collapse;font-size:11px}
  th,td{text-align:left;padding:5px 7px;border-bottom:1px solid var(--line);
    vertical-align:top;white-space:nowrap}
  th{color:var(--muted);font-weight:600;font-size:9px;
    text-transform:uppercase;letter-spacing:.02em;cursor:pointer;
    background:var(--panel2);position:sticky;top:0;z-index:2}
  th:hover{color:var(--txt)}
  tr:hover td{background:#f0f4fa}
  .ellipsis{max-width:180px;overflow:hidden;text-overflow:ellipsis;display:inline-block;
    white-space:nowrap}
  .pill{display:inline-block;padding:1px 6px;border-radius:8px;font-size:10px;
    font-weight:600;color:#0f1419}
  .small{font-size:10px}
  .muted{color:var(--muted)}
  .no-match{text-align:center;padding:30px;color:var(--muted);font-size:13px}
  .badge{display:inline-block;background:#e8ecf1;border-radius:10px;padding:0 6px;
    font-size:10px;line-height:18px;margin-left:4px;font-weight:600;color:var(--muted)}

  /* Insights */
  .insight-box{background:#fef9ef;border-left:3px solid var(--t3);
    padding:8px 10px;border-radius:0 5px 5px 0;margin-bottom:6px;font-size:11px;
    line-height:1.6}
  .insight-box .prio{display:inline-block;background:var(--t1);color:#fff;
    font-size:9px;padding:1px 5px;border-radius:3px;margin-right:5px;font-weight:600}
  .insight-box .prio.p1{background:var(--t2)}
  .insight-box .prio.p2{background:var(--t4)}

  /* Legend */
  .legend{display:flex;gap:10px;flex-wrap:wrap;font-size:10px;margin-top:6px}
  .legend .it{display:flex;align-items:center;gap:4px}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block}

  .disclaim{font-size:10px;color:var(--muted);background:#fef3cd;
    border:1px solid #e0d68a;border-radius:5px;padding:6px 8px;margin-top:8px}
</style>
</head>

  </div>
</div>

四川大学华西医院\n无锡市第二人民医院\n宁波市眼科医院\n西安市人民医院\n深圳市人民医院", "重庆医科大学附属第一医院\n复旦大学附属眼耳鼻喉科医院\n中国医学科学院北京协和医院\n浙江大学医学院附属第二医院\n湖北省人民医院（武汉大学人民医院）\n天津医科大学眼科医院\n郑州大学第一附属医院\n吉林大学第二附属医院\n北京大学第一医院\n温州医学院附属眼视光医院\n中山大学中山眼科中心\n中南大学湘雅二医院\n四川大学华西医院\n河南省立眼科医院\n福建医科大学附属第一医院"], "cn_pi_options": ["‌迟玮", "张晓敏", "张美芬", "张美芬\n杨培增\n张晓敏\n魏文斌\n肖璇", "杨培增", "杨培增\n杨柳\n张晓敏\n王毓琴\n师燕芸\n张美芬\n范珂\n王泓\n迟玮\n徐格致\n苏冠芳\n杜利平\n魏文斌\n梅海峰\n赵明威\n戴虹\n姚克\n徐筑萍\n武志峰\n陈蔚\n陈颖\n杨明明", "杨培增\n江冰\n梅海峰\n吴强\n张美芬\n张晓敏\n苏冠方\n刘丹岩\n杜利平", "杨培增\n陈玲\n张美芬\n姚克\n梅海峰\n张晓敏\n杜利平\n苏冠方\n杨柳\n王毓琴\n梁丹\n江冰\n陆方\n范珂\n朱益华", "杨培增\n魏文彬\n张美芬\n杨柳", "梁丹", "郑文洁"]}, "insights": [{"priority": "P0", "text": "非激素长期控炎——现有非激素选择仅有 adalimumab（全身注射），患者依从性差"}, {"priority": "P0", "text": "儿童葡萄膜炎——数据极少，仅 1 个 JIA-uveitis 专门试验"}, {"priority": "P1", "text": "JAK/TYK 抑制剂是最大增量战场——brepocitinib 和 VVN-461 均处 Phase III"}, {"priority": "P1", "text": "IL-6 通路受关注——vamikibart (Roche) MEERKAT ✓ / SANDCAT ✗，结果分化"}, {"priority": "P1", "text": "中国在局部 JAKi 滴眼液赛道可能领先——VVN-461 是全球唯一 Phase III 的局部 JAKi"}, {"priority": "P2", "text": "TNF 抑制剂赛道拥挤——adalimumab 已过专利期，生物类似药纷纷进场"}, {"priority": "P2", "text": "葡萄膜炎是'旧药成熟、新药冲刺'的孤儿药市场——糖皮质激素 + adalimumab 构成标准治疗护城河"}]}</script>
<script>
const D = JSON.parse(document.getElementById('model').textContent);
const charts = {};
const STATE = {filters:{}};

function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,
  c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function pill(label,color){return `<span class="pill" style="background:${color}">${esc(label)}</span>`;}

const PHASE_COLORS = {
  'I':'#93c5fd','I/II':'#7dd3fc','II':'#34d399','II/III':'#6ee7b7',
  'III':'#fbbf24','III/IV':'#f59e0b','IV':'#f87171','N/A':'#9ca3af'
};
const STATUS_COLORS = {
  'Open':'#34d399','Planned':'#fbbf24','Completed':'#93c5fd',
  'Closed':'#9ca3af','Terminated':'#f87171','Unknown':'#d1d5db'
};

document.getElementById('genDate').textContent = D.generated_at.slice(0,10);
initKPI(); initFilters(); renderTable();
drawPhaseChart(); drawStatusChart(); drawMoaChart(); renderInsights();

function initKPI(){
  const c = D.counts;
  document.getElementById('kpiCards').innerHTML = `
    <div class="card"><div class="n">${c.total_records}</div><div class="l">研究记录总数</div></div>
    <div class="card"><div class="n">${c.unique_drugs}</div><div class="l">独特在研药物</div></div>
    <div class="card"><div class="n">${c.unique_moas}</div><div class="l">独特 MOA 机制</div></div>
    <div class="card"><div class="n">${c.unique_sponsors}</div><div class="l">申办方 / 赞助商</div></div>
    <div class="card"><div class="n">${D.phase_dist.filter(p=>['III','II','IV'].includes(p.label)).reduce((s,p)=>s+p.count,0)}</div><div class="l">Phase II-IV 管线</div></div>`;
}

function initFilters(){
  const f = D.filters;
  const sb = (id,opts) => `<select id="${id}"><option value="">全部</option>${opts.map(o=>`<option value="${esc(o)}">${esc(o).slice(0,50)}</option>`).join('')}</select>`;
  const ms = (id,opts,p) => `<select id="${id}" multiple style="min-height:60px"><option value="">-- ${p} --</option>${opts.map(o=>`<option value="${esc(o)}">${esc(o).slice(0,45)}</option>`).join('')}</select>`;

  document.getElementById('filterBar').innerHTML = `
    <div class="row">
      <div class="grp" style="flex:2;min-width:140px">
        <label>🔍 搜索标题/药物/PI</label>
        <input class="search-box" id="searchInput" placeholder="输入关键词...">
      </div>
      <div class="grp"><label>研究分期</label>${sb('filterPhase',f.phase_options)}</div>
      <div class="grp"><label>研究状态</label>${sb('filterStatus',f.status_options)}</div>
      <div class="grp"><label>中国Site</label>${sb('filterCnSite',f.cn_site_options)}</div>
      <div class="grp" style="flex:1.5"><label>主要药物</label>${ms('filterDrug',f.drug_options,'选择药物')}</div>
      <div class="grp" style="flex:1.5"><label>赞助方</label>${ms('filterSponsor',f.sponsor_options,'选择赞助方')}</div>
      <div class="grp" style="flex:1.5"><label>中国PI医院</label>${ms('filterCnHosp',f.cn_hosp_options,'选择医院')}</div>
      <div class="grp" style="align-self:flex-end;display:flex;gap:4px">
        <button class="btn btn-primary" id="applyFilter">筛选</button>
        <button class="btn btn-outline" id="resetFilter">重置</button>
      </div>
    </div>`;
  document.getElementById('applyFilter').addEventListener('click',applyFilters);
  document.getElementById('resetFilter').addEventListener('click',resetFilters);
  document.getElementById('searchInput').addEventListener('input', debounce(applyFilters, 350));
}

function debounce(fn,ms){let t; return function(...a){clearTimeout(t);t=setTimeout(()=>fn.apply(this,a),ms);};}

function getMulti(id){
  const el=document.getElementById(id);
  return Array.from(el.selectedOptions).map(o=>o.value).filter(v=>v!=='');
}

function applyFilters(){
  STATE.filters = {
    search: (document.getElementById('searchInput').value||'').trim().toLowerCase(),
    phase: document.getElementById('filterPhase').value,
    status: document.getElementById('filterStatus').value,
    cn_site: document.getElementById('filterCnSite').value,
    drug: getMulti('filterDrug'),
    sponsor: getMulti('filterSponsor'),
    cn_hosp: getMulti('filterCnHosp'),
  };
  renderTable();
}

function resetFilters(){
  document.getElementById('searchInput').value='';
  ['filterPhase','filterStatus','filterCnSite'].forEach(id=>document.getElementById(id).value='');
  ['filterDrug','filterSponsor','filterCnHosp'].forEach(id=>{const el=document.getElementById(id);Array.from(el.options).forEach(o=>o.selected=false);});
  STATE.filters={};
  renderTable();
}

let sortCol=-1, sortAsc=true;

function renderTable(){
  const f = STATE.filters||{};
  let rows = D.records.filter(r => {
    if(f.search){
      const txt = ((r.title||'')+' '+(r.drug||'')+' '+(r.cn_pi||'')+' '+(r.cn_hosp||'')).toLowerCase();
      if(!txt.includes(f.search)) return false;
    }
    if(f.phase && r.phase!==f.phase) return false;
    if(f.status && r.status!==f.status) return false;
    if(f.cn_site && r.cn_site!==f.cn_site) return false;
    if(f.drug && f.drug.length && !f.drug.some(d=>(r.drug||'').includes(d))) return false;
    if(f.sponsor && f.sponsor.length && !f.sponsor.some(s=>(r.sponsor||'').includes(s))) return false;
    if(f.cn_hosp && f.cn_hosp.length && !f.cn_hosp.some(h=>(r.cn_hosp||'').includes(h))) return false;
    return true;
  });

  if(sortCol>=0){
    const cols=['title','drug','phase','status','sponsor','cn_pi','patients','pcd'];
    const key=cols[sortCol]||'title';
    rows.sort((a,b)=>{
      let va=(a[key]||'').toString().toLowerCase();
      let vb=(b[key]||'').toString().toLowerCase();
      if(key==='patients'){va=Number(va)||0;vb=Number(vb)||0;}
      return va<vb ? (sortAsc?-1:1) : (va>vb?(sortAsc?1:-1):0);
    });
  }

  document.getElementById('tableCount').textContent = rows.length+' 条';

  if(!rows.length){
    document.getElementById('tableContainer').innerHTML='<div class="no-match">📭 无匹配结果，请调整筛选条件</div>';
    return;
  }

  const ths = [
    {k:'title',l:'试验标题'},{k:'drug',l:'主要药物'},{k:'phase',l:'分期'},
    {k:'status',l:'状态'},{k:'sponsor',l:'赞助方'},{k:'cn_pi',l:'中国PI'},
    {k:'patients',l:'患者数'},{k:'pcd',l:'主要终点完成'}
  ];
  let h='<table><thead><tr>';
  ths.forEach((t,i)=>{
    const arrow = sortCol===i ? (sortAsc?' ▲':' ▼') : '';
    h+=`<th onclick="sortTable(${i})">${t.l}${arrow}</th>`;
  });
  h+='</tr></thead><tbody>';

  rows.forEach(r=>{
    const pc=PHASE_COLORS[r.phase]||'#9ca3af';
    const sc=STATUS_COLORS[r.status]||'#d1d5db';
    h+=`<tr>
      <td><span class="ellipsis" title="${esc(r.title)}">${esc(r.title).slice(0,60)}</span></td>
      <td><strong>${esc(r.drug)}</strong>${r.combo&&r.combo!=='N/A'?'<br><span class="small muted">+'+esc(r.combo)+'</span>':''}</td>
      <td>${pill(r.phase,pc)}</td>
      <td>${pill(r.status,sc)}</td>
      <td><span class="ellipsis" title="${esc(r.sponsor)}">${esc(r.sponsor).slice(0,28)}</span></td>
      <td>${r.cn_pi?esc(r.cn_pi):'<span class="muted">—</span>'}</td>
      <td>${r.patients||''}</td>
      <td class="small">${r.pcd?esc(r.pcd).slice(0,10):''}</td>
    </tr>`;
  });
  h+='</tbody></table>';
  document.getElementById('tableContainer').innerHTML = h;
}

function sortTable(col){
  if(sortCol===col) sortAsc=!sortAsc;
  else{sortCol=col;sortAsc=true;}
  renderTable();
}

function drawPhaseChart(){
  const ctx=document.getElementById('phaseChart');
  if(charts.phase) charts.phase.destroy();
  charts.phase=new Chart(ctx,{
    type:'doughnut',
    data:{
      labels:D.phase_dist.map(d=>d.label),
      datasets:[{data:D.phase_dist.map(d=>d.count),
        backgroundColor:D.phase_dist.map(d=>PHASE_COLORS[d.label]||'#9ca3af'),
        borderWidth:2,borderColor:'#fff'}]
    },
    options:{
      responsive:true,maintainAspectRatio:false,
      plugins:{
        legend:{position:'right',labels:{color:'#6b7a8f',font:{size:10},padding:8}},
        tooltip:{callbacks:{label:c=>c.label+': '+c.raw+' 条'}}
      }
    }
  });
}

function drawStatusChart(){
  const ctx=document.getElementById('statusChart');
  if(charts.status) charts.status.destroy();
  charts.status=new Chart(ctx,{
    type:'bar',
    data:{
      labels:D.status_dist.map(d=>d.label),
      datasets:[{label:'试验数',data:D.status_dist.map(d=>d.count),
        backgroundColor:D.status_dist.map(d=>STATUS_COLORS[d.label]||'#d1d5db'),
        borderRadius:4}]
    },
    options:{
      responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false}},
      scales:{
        x:{ticks:{color:'#6b7a8f'},grid:{color:'#d9dee6'}},
        y:{ticks:{color:'#6b7a8f'},grid:{color:'#d9dee6'},beginAtZero:true}
      }
    }
  });
}

function drawMoaChart(){
  const ctx=document.getElementById('moaChart');
  if(charts.moa) charts.moa.destroy();
  const labels=D.moa_chart.map(d=>d.label.length>22?d.label.slice(0,21)+'…':d.label);
  const vals=D.moa_chart.map(d=>d.count);
  const colors=['#2563eb','#3b82f6','#60a5fa','#93c5fd','#7c3aed','#8b5cf6','#a78bfa',
    '#c4b5fd','#059669','#34d399','#6ee7b7','#a7f3d0','#d97706'];
  charts.moa=new Chart(ctx,{
    type:'doughnut',
    data:{labels,datasets:[{data:vals,backgroundColor:colors.slice(0,vals.length),borderWidth:2,borderColor:'#fff'}]},
    options:{
      responsive:true,maintainAspectRatio:false,
      plugins:{
        legend:{position:'bottom',labels:{color:'#6b7a8f',font:{size:9},padding:6,boxWidth:10}},
        tooltip:{callbacks:{label:c=>c.label+': '+c.raw+' 个'}}
      }
    }
  });
}

function renderInsights(){
  let h='';
  D.insights.forEach(ins=>{
    const cls=ins.priority==='P0'?'':ins.priority==='P1'?'p1':'p2';
    h+=`<div class="insight-box"><span class="prio ${cls}">${esc(ins.priority)}</span>${esc(ins.text)}</div>`;
  });
  document.getElementById('insightContainer').innerHTML = h;
}
</script>
</body>
</html>
